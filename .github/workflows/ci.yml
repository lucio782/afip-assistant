name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm install
      - name: Levantar servidor y correr tests
        env:
          ADMIN_KEY: clave_test_ci
        run: |
          PORT=3000 node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/status > /dev/null 2>&1; then break; fi
            sleep 1
          done
          node tests/api.test.js http://localhost:3000
          EXIT=$?
          kill %1 2>/dev/null || true
          exit $EXIT
